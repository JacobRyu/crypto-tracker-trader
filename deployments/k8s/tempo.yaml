apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ctt-dev
data:
  config.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: ctt-cluster
      storage:
        path: /var/tempo/wal
        remote_write: []
      processor:
        service_graphs:
          dimensions:
            - http.method
            - http.status_code
        span_metrics:
          dimensions:
            - http.method
            - http.status_code

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces

    overrides:
      defaults:
        metrics_generator:
          processor:
            service_graphs:
              dimensions:
                - http.method
            span_metrics:
              dimensions:
                - http.method
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ctt-dev
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args:
            - -config.file=/etc/tempo/config.yaml
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: tempo-data
              mountPath: /var/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: tempo-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ctt-dev
  labels:
    app: tempo
spec:
  type: ClusterIP
  ports:
    - port: 3200
      targetPort: 3200
      name: http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
  selector:
    app: tempo
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-nodeport
  namespace: ctt-dev
  labels:
    app: tempo
spec:
  type: NodePort
  ports:
    - port: 3200
      targetPort: 3200
      nodePort: 30320
      name: http
  selector:
    app: tempo
