apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ctt-dev
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.0
          command:
            - sh
            - -c
            - |
              migrate -path /migrations -database "postgres://ctt:password@postgres:5432/crypto?sslmode=disable" up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: migration-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-scripts
  namespace: ctt-dev
data:
  0001_create_users.up.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE users (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      username VARCHAR(255) UNIQUE NOT NULL,
      password_hash VARCHAR(255) NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
  0002_create_portfolio_tables.up.sql: |
    CREATE TABLE portfolios (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      name VARCHAR(255) NOT NULL,
      description TEXT,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE TABLE portfolio_snapshots (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      portfolio_id UUID NOT NULL REFERENCES portfolios(id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE SET NULL,
      balance DECIMAL(20, 8) NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE INDEX idx_portfolio_snapshots_portfolio_id ON portfolio_snapshots(portfolio_id);
    CREATE INDEX idx_portfolio_snapshots_created_at ON portfolio_snapshots(created_at);
  0003_add_wallet_unique_constraint.up.sql: |
    CREATE TABLE IF NOT EXISTS wallets (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      address VARCHAR(255) NOT NULL,
      chain VARCHAR(50) NOT NULL,
      name VARCHAR(255),
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    ALTER TABLE wallets ADD CONSTRAINT unique_wallet_user_address UNIQUE (user_id, address);
  0004_create_price_data.up.sql: |
    CREATE TABLE price_data (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      symbol VARCHAR(20) NOT NULL,
      price DECIMAL(20, 8) NOT NULL,
      source VARCHAR(50) NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE INDEX idx_price_data_symbol ON price_data(symbol);
    CREATE INDEX idx_price_data_created_at ON price_data(created_at);
  0005_create_exchange_credentials.up.sql: |
    CREATE TABLE exchange_credentials (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      exchange VARCHAR(50) NOT NULL,
      api_key_encrypted TEXT NOT NULL,
      api_secret_encrypted TEXT NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE TABLE exchange_balances (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      credential_id UUID NOT NULL REFERENCES exchange_credentials(id) ON DELETE CASCADE,
      asset VARCHAR(20) NOT NULL,
      free DECIMAL(20, 8) NOT NULL DEFAULT 0,
      locked DECIMAL(20, 8) NOT NULL DEFAULT 0,
      total DECIMAL(20, 8) NOT NULL DEFAULT 0,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    CREATE INDEX idx_exchange_balances_credential_id ON exchange_balances(credential_id);
  0006_add_defi_indexes.up.sql: |
    CREATE INDEX idx_defi_positions_wallet_id ON defi_positions(wallet_id);
    CREATE INDEX idx_defi_positions_protocol ON defi_positions(protocol);
  0007_add_user_id_to_snapshots.up.sql: |
    ALTER TABLE portfolio_snapshots ADD COLUMN user_id UUID REFERENCES users(id) ON DELETE SET NULL;
