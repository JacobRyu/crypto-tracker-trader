apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: ctt-dev
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          ports:
            - containerPort: 9308
          args:
            - --kafka.server=kafka:9092
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: ctt-dev
  labels:
    app: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9308
      targetPort: 9308
  selector:
    app: kafka-exporter
